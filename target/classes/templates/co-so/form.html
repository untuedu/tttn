<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/layout :: shell(~{::main})}">
<main>
    <section class="panel form-panel">
        <div class="panel-head"><h2 th:text="${title}">Form</h2></div>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form method="post" action="/co-so" th:object="${item}" class="entity-form">
            <input type="hidden" th:field="*{maCoSoNuoiTrong}">
            <label>Dien tich</label><input type="number" step="0.1" th:field="*{dienTich}" required>
            <label>Dien tich da su dung</label><input type="number" step="0.1" th:field="*{dienTichDaSuDung}" required>
            <label>Dia chi</label><input th:field="*{diaChi}" required>
            <div class="form-actions"><a href="/co-so">Quay lai</a><button type="submit">Luu</button></div>
        </form>
    </section>
</main>
</body>
</html>
