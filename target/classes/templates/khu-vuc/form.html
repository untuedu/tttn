<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/layout :: shell(~{::main})}">
<main><section class="panel form-panel"><div class="panel-head"><h2 th:text="${title}">Form</h2></div>
    <form method="post" action="/khu-vuc" th:object="${item}" class="entity-form">
        <input type="hidden" th:field="*{maKhuVuc}">
        <label>Ten khu vuc</label><input th:field="*{tenKhuVuc}" required>
        <label>Dien tich</label><input type="number" step="0.1" th:field="*{dienTich}" required>
        <label>San pham</label><input th:field="*{sanPham}">
        <label>Hinh anh san pham</label><input th:field="*{hinhAnhSanPham}">
        <label>Nguoi quan ly</label><select name="nguoiDungId" required><option th:each="u:${nguoiDungs}" th:value="${u.maNguoiDung}" th:selected="${item.nguoiDung != null && item.nguoiDung.maNguoiDung == u.maNguoiDung}" th:text="${u.tenNguoiDung}"></option></select>
        <label>Co so</label><select name="coSoId" required><option th:each="c:${coSos}" th:value="${c.maCoSoNuoiTrong}" th:selected="${item.coSoNuoiTrong != null && item.coSoNuoiTrong.maCoSoNuoiTrong == c.maCoSoNuoiTrong}" th:text="${c.diaChi}"></option></select>
        <div class="form-actions"><a href="/khu-vuc">Quay lai</a><button type="submit">Luu</button></div>
    </form>
</section></main>
</body>
</html>
