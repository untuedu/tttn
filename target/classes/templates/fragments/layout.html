<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'HTX Farm'">HTX Farm</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<aside class="sidebar">
    <div class="brand">
        <span class="brand-mark">HTX</span>
        <span>Quan ly nong nghiep</span>
    </div>
    <nav>
        <a th:classappend="${active == 'dashboard'} ? 'active'" href="/">Thong ke</a>
        <a th:classappend="${active == 'co-so'} ? 'active'" href="/co-so">Co so nuoi trong</a>
        <a th:classappend="${active == 'khu-vuc'} ? 'active'" href="/khu-vuc">Khu vuc</a>
        <a th:classappend="${active == 'kho'} ? 'active'" href="/kho-vat-tu">Kho vat tu</a>
        <a th:classappend="${active == 'mua-sam'} ? 'active'" href="/mua-sam">Nhat ky mua sam</a>
        <a th:classappend="${active == 'san-xuat'} ? 'active'" href="/san-xuat">Nhat ky san xuat</a>
        <a th:classappend="${active == 'thu-hoach'} ? 'active'" href="/thu-hoach">Nhat ky thu hoach</a>
        <a th:classappend="${active == 'ban'} ? 'active'" href="/ban-san-pham">Ban san pham</a>
    </nav>
</aside>
<div class="app">
    <header class="topbar">
        <h1 th:text="${title}">Trang quan ly</h1>
        <div class="userbar">
            <span th:text="${session.user != null ? session.user.tenNguoiDung : 'Nguoi dung'}">Nguoi dung</span>
            <a href="/logout">Dang xuat</a>
        </div>
    </header>
    <main th:replace="${content}"></main>
</div>
<section class="chatbot">
    <button id="chatToggle" class="chat-toggle" type="button">AI</button>
    <div id="chatPanel" class="chat-panel">
        <div class="chat-head">Tro ly HTX</div>
        <div id="chatMessages" class="chat-messages">
            <div class="bot">Xin chao, ban can ho tro ve san xuat, vat tu hay thu hoach?</div>
        </div>
        <form id="chatForm" class="chat-form">
            <input id="chatInput" autocomplete="off" placeholder="Nhap cau hoi...">
            <button type="submit">Gui</button>
        </form>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
