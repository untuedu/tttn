<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/layout :: shell(~{::main})}">
<main>
    <section class="panel form-panel">
        <div class="panel-head"><h2 th:text="${title}">Form</h2></div>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form method="post" action="/kho-vat-tu" th:object="${item}" class="entity-form">
            <input type="hidden" th:field="*{maKhoVatTu}">
            <label>Tên kho</label><input th:field="*{tenKho}" required>
            <div class="form-actions"><a href="/kho-vat-tu">Quay lại</a><button type="submit">Lưu</button></div>
        </form>
    </section>
</main>
</body>
</html>
