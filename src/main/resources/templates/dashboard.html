<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/layout :: shell(~{::main})}">
<main>
    <section class="stats-grid">
        <article class="stat"><span>Cơ sở</span><strong th:text="${coSoCount}">0</strong></article>
        <article class="stat"><span>Kho vật tư</span><strong th:text="${khoCount}">0</strong></article>
        <article class="stat"><span>Khu vực</span><strong th:text="${khuVucCount}">0</strong></article>
        <article class="stat"><span>Doanh thu</span><strong th:text="${#numbers.formatDecimal(doanhThu,0,'COMMA',0,'POINT')}">0</strong></article>
    </section>
    <section class="panel">
        <div class="panel-head">
            <h2>Báo cáo tổng hợp</h2>
            <a class="btn" href="/mua-sam">Xem nhật ký</a>
        </div>
        <canvas id="dashboardChart" height="90"
                th:attr="data-income=${doanhThu},data-cost=${chiPhi},data-area=${khuVucCount}"></canvas>
    </section>
</main>
</body>
</html>
