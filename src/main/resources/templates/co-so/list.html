<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/layout :: shell(~{::main})}">
<main>
    <section class="panel">
        <div class="panel-head"><h2>Danh sách cơ sở nuôi trồng</h2><a class="btn" href="/co-so/new">Thêm mới</a></div>
        <table>
            <thead><tr><th>Mã</th><th>Diện tích</th><th>Đã sử dụng</th><th>Địa chỉ</th><th></th></tr></thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.maCoSoNuoiTrong}"></td>
                <td th:text="${item.dienTich}"></td>
                <td th:text="${item.dienTichDaSuDung}"></td>
                <td th:text="${item.diaChi}"></td>
                <td class="actions"><a th:href="@{/co-so/{id}/edit(id=${item.maCoSoNuoiTrong})}">Sửa</a><form th:action="@{/co-so/{id}/delete(id=${item.maCoSoNuoiTrong})}" method="post"><button>Xóa</button></form></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
