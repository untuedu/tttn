<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/layout :: shell(~{::main})}">
<main>
    <section class="panel">
        <div class="panel-head"><h2>Danh sách khu vực nuôi trồng</h2><a class="btn" href="/khu-vuc/new">Thêm mới</a></div>
        <table>
            <thead><tr><th>Mã</th><th>Tên khu vực</th><th>Diện tích</th><th>Sản phẩm</th><th>Quản lý</th><th>Cơ sở</th><th></th></tr></thead>
            <tbody><tr th:each="item : ${items}">
                <td th:text="${item.maKhuVuc}"></td><td th:text="${item.tenKhuVuc}"></td><td th:text="${item.dienTich}"></td><td th:text="${item.sanPham}"></td>
                <td th:text="${item.nguoiDung != null ? item.nguoiDung.tenNguoiDung : ''}"></td><td th:text="${item.coSoNuoiTrong != null ? item.coSoNuoiTrong.diaChi : ''}"></td>
                <td class="actions"><a th:href="@{/khu-vuc/{id}/edit(id=${item.maKhuVuc})}">Sửa</a><form th:action="@{/khu-vuc/{id}/delete(id=${item.maKhuVuc})}" method="post"><button>Xóa</button></form></td>
            </tr></tbody>
        </table>
    </section>
</main>
</body>
</html>
