<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/layout :: shell(~{::main})}">
<main><section class="panel form-panel"><div class="panel-head"><h2 th:text="${title}">Form</h2></div>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form method="post" action="/ban-san-pham" th:object="${item}" class="entity-form">
        <label>Đợt thu hoạch</label><select name="thuHoachId" required><option th:each="th:${thuHoachs}" th:value="${th.maNhatKyThuHoach}" th:text="${'Đợt #' + th.maNhatKyThuHoach + ' - ' + th.soLuongThuHoach + ' kg'}"></option></select>
        <label>Số lượng bán</label><input type="number" th:field="*{soLuong}" required>
        <label>Giá bán</label><input type="number" step="1000" th:field="*{giaBan}" required>
        <label>Ngày bán</label><input type="date" th:field="*{ngayBan}">
        <div class="form-actions"><a href="/ban-san-pham">Quay lại</a><button type="submit">Lưu</button></div>
    </form>
</section></main>
</body>
</html>
