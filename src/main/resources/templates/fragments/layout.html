<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'HTX Farm'">HTX Farm</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<aside class="sidebar">
    <div class="brand">
        <span class="brand-mark">HTX</span>
        <span>Quản lý nông nghiệp</span>
    </div>
    <nav>
        <a th:classappend="${active == 'dashboard'} ? 'active'" href="/">Thống kê</a>
        <a th:classappend="${active == 'co-so'} ? 'active'" href="/co-so">Cơ sở nuôi trồng</a>
        <a th:classappend="${active == 'khu-vuc'} ? 'active'" href="/khu-vuc">Khu vực</a>
        <a th:classappend="${active == 'kho'} ? 'active'" href="/kho-vat-tu">Kho vật tư</a>
        <a th:classappend="${active == 'mua-sam'} ? 'active'" href="/mua-sam">Nhật ký mua sắm</a>
        <a th:classappend="${active == 'san-xuat'} ? 'active'" href="/san-xuat">Nhật ký sản xuất</a>
        <a th:classappend="${active == 'thu-hoach'} ? 'active'" href="/thu-hoach">Nhật ký thu hoạch</a>
        <a th:classappend="${active == 'ban'} ? 'active'" href="/ban-san-pham">Bán sản phẩm</a>
    </nav>
</aside>
<div class="app">
    <header class="topbar">
        <h1 th:text="${title}">Trang quản lý</h1>
        <div class="userbar">
            <span th:text="${session.user != null ? session.user.tenNguoiDung : 'Người dùng'}">Người dùng</span>
            <a href="/logout">Đăng xuất</a>
        </div>
    </header>
    <main th:replace="${content}"></main>
</div>
<section class="chatbot">
    <button id="chatToggle" class="chat-toggle" type="button">AI</button>
    <div id="chatPanel" class="chat-panel">
        <div class="chat-head">Trợ lý HTX</div>
        <div id="chatMessages" class="chat-messages">
            <div class="bot">Xin chào, bạn cần hỗ trợ về sản xuất, vật tư hay thu hoạch?</div>
        </div>
        <form id="chatForm" class="chat-form">
            <input id="chatInput" autocomplete="off" placeholder="Nhập câu hỏi...">
            <button type="submit">Gửi</button>
        </form>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
